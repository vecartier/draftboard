<meta name="claude:viewport-fit-sides" content="cover">
<!--
DRAFTBOARD HOME, for Claude. This artifact lists the person's Draftboard boards. It can't see other artifacts
by itself, so Claude keeps its list with the ArtifactData tool on this artifact's URL:
- collection "boards", doc_id = the board artifact's id (the last part of its URL), data:
  {"url": "https://claude.ai/artifact/<id>", "title": <board name>, "created": <ISO time>, "updated": <ISO time>,
   "thumb": {"assetId": <id>, "url": "/_blob/<id>"} (optional: a picture of the board copied into THIS artifact's assets)}
- The page itself writes "hidden" (true/false) and "alias" (a name the person typed here); keep those when you update a row
  (use "update", never "set", on an existing row).
-->

<script>
(() => {
  const $ = (s) => document.querySelector(s);

  const NEW_CMD = '/draftboard';
  let db = null, rows = [], loaded = false, showHidden = false, query = '';

  const icon = (id) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('class', 'i'); const u = document.createElementNS('http://www.w3.org/2000/svg', 'use'); u.setAttribute('href', '#i-' + id); s.append(u); return s; };

  function ago(iso) {

    const m = s / 60, h = m / 60, d = h / 24;
    if (m < 60) return `Edited ${Math.round(m)} min ago`;
    if (h < 24) return `Edited ${Math.round(h)} h ago`;
    if (d < 2) return 'Edited yesterday';
    if (d < 7) return `Edited ${Math.round(d)} days ago`;

    menuEl = el('div', { class: 'menu', role: 'menu' },
      url && item('open', 'Open board', () => { const a = el('a', { href: url, target: '_blank', rel: 'noopener' }); document.body.append(a); a.click(); a.remove(); }),

  }

    if (!db) { toast('Your boards list isn’t reachable right now'); return; }
    try { await db.collection('boards').doc(id).update(data); if (done) toast(done); }

  function sheet(...kids) {
    closeSheet();
    sheetEl = el('div', { class: 'scrim', onclick: (e) => { if (e.target === sheetEl) closeSheet(); } }, el('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true' }, ...kids));
    document.body.append(sheetEl);
    return sheetEl;
  }

  function openRename(r) {
    const input = el('input', { type: 'text', id: 'rename-input', value: nameOf(r), maxlength: '80' });
    const save = () => { const v = input.value.trim(); closeSheet(); write(r.id, { alias: v && v !== r.title ? v : null }, 'Renamed'); };
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); });
    sheet(el('h2', { text: 'Rename on home' }), el('p', { text: 'This changes the name shown here. The board keeps its own name inside the editor.' }),
      el('div', {}, el('label', { for: 'rename-input', text: 'Name' }), input),
      el('div', { class: 'row' }, el('button', { class: 'btn quiet', text: 'Cancel', onclick: closeSheet }), el('button', { class: 'btn primary', text: 'Save', onclick: save })));
    input.focus(); input.select();
  }

  function openNew() {
    const link = el('input', { type: 'url', id: 'add-link', placeholder: 'https://claude.ai/artifact/…', autocomplete: 'off' });
    const err = el('div', { class: 'err', hidden: '' });
    const add = async () => {
      const m = /https:\/\/claude\.ai\/(?:code\/)?artifact\/([\w-]+)/.exec(link.value.trim());
      if (!m) { err.textContent = 'Paste a board’s link. It starts with https://claude.ai/artifact/'; err.hidden = false; return; }
      if (!db) { err.textContent = 'Your boards list isn’t reachable right now.'; err.hidden = false; return; }
      const id = m[1], now = new Date().toISOString();
      try {
        const ref = db.collection('boards').doc(id);
        const got = await ref.get();
        if (got.exists) await ref.update({ hidden: false }); else await ref.set({ url: 'https://claude.ai/artifact/' + id, title: 'Board', created: now, updated: now, addedHere: true });
        closeSheet(); toast(got.exists ? 'Already here, now shown' : 'Added. Rename it from its ⋯ menu');
      } catch { err.textContent = 'That didn’t save. Try again in a moment.'; err.hidden = false; }
    };
    link.addEventListener('keydown', (e) => { if (e.key === 'Enter') add(); });
    sheet(el('h2', { text: 'New board' }),
      el('p', { text: 'Claude makes new boards. In any Claude Code chat, type this, or say what to sketch after it. The board opens beside the chat and shows up here.' }),
      el('div', { class: 'cmd' }, el('code', { text: NEW_CMD }), el('button', { class: 'btn', onclick: () => copy(NEW_CMD, 'Copied /draftboard') }, icon('copy'), document.createTextNode('Copy'))),
      el('hr'),
      el('div', {}, el('label', { for: 'add-link', text: 'Or add a board you already have' }), link, err),
      el('div', { class: 'row' }, el('button', { class: 'btn quiet', text: 'Cancel', onclick: closeSheet }), el('button', { class: 'btn', onclick: add }, icon('link'), document.createTextNode('Add by link'))));
  }

  $('#new').addEventListener('click', openNew);
  $('#q').addEventListener('input', (e) => { query = e.target.value; render(); });
  $('#showHidden').addEventListener('click', () => { showHidden = !showHidden; render(); });

  render();
  const timer = setTimeout(() => { if (!loaded) { note.hidden = false; note.textContent = 'Your boards are taking a while to load. Check your connection; they’ll appear once it’s back.'; } }, 10000);

  (async () => {
    const claude = window.claude;
    if (!claude || !claude.use) { note.hidden = false; note.textContent = 'Open this page in Claude to see your boards.'; clearTimeout(timer); return; }
    const desktop = await claude.use('desktop').catch(() => null);
    if (desktop && !desktop.fs && desktop.install) {
      try { if ((await desktop.install.state()) === 'available') { const b = $('#install'); b.hidden = false; b.onclick = () => desktop.install.request().catch(() => toast('Install from the artifact’s menu in the Claude app')); } } catch {}
    }
    db = await claude.use('db');
    if (!db) { clearTimeout(timer); note.hidden = false; note.textContent = 'Sign in to Claude to see your boards.'; return; }
    db.collection('boards').onSnapshot((snap) => {
      rows = snap.docs.filter((d) => d.exists).map((d) => ({ id: d.id, ...d.data() }));
      if (!snap.metadata || !snap.metadata.fromCache) { loaded = true; clearTimeout(timer); note.hidden = true; }
      else loaded = true;
      render();
    }, () => { clearTimeout(timer); loaded = true; note.hidden = false; note.textContent = 'Your boards can’t be reached right now. Reopen this page to try again.'; render(); });
  })();
})();
</script>
